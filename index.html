<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        canvas {
            display: block;
            background: black;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 107, 107, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    
    <script>
        // ===== НАСТРОЙКИ =====
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        // Адаптивный размер
        function resizeCanvas() {
            const size = Math.min(window.innerWidth - 40, window.innerHeight - 40, 600);
            canvas.width = size;
            canvas.height = size;
        }
        resizeCanvas();
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const scale = 15;
        
        // ===== ФУНКЦИЯ ДЛЯ РАСЧЁТА ТОЧЕК СЕРДЦА =====
        function getHeartPoints() {
            const points = [];
            const steps = 120;
            
            for (let i = 0; i < steps; i++) {
                const angle = (i / steps) * 2 * Math.PI;
                
                // Формула сердца из вашего Python кода
                const x = 16 * Math.pow(Math.sin(angle), 3) * scale;
                const y = (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale;
                
                points.push({
                    x: centerX + x,
                    y: centerY - y
                });
            }
            
            return points;
        }
        
        // ===== МЕДЛЕННОЕ ПОЯВЛЕНИЕ ПО ОДНОМУ СЛОВУ =====
        const points = getHeartPoints();
        let currentIndex = 0; // Текущий индекс слова
        let animationId = null;
        let isAnimating = false;
        const fontSize = Math.max(canvas.width / 35, 10);
        
        // Храним все нарисованные слова
        let drawnWords = [];
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем все уже появившиеся слова
            for (let i = 0; i < drawnWords.length; i++) {
                const word = drawnWords[i];
                ctx.fillStyle = `hsl(340, 100%, ${word.brightness}%)`;
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(255, 20, 147, 0.5)';
                ctx.shadowBlur = 10;
                ctx.fillText('I love you Sabina', word.x, word.y);
            }
            ctx.shadowBlur = 0;
            
            // Если есть ещё слова - добавляем следующее с задержкой
            if (currentIndex < points.length) {
                // Добавляем одно слово
                const p = points[currentIndex];
                const brightness = 60 + (currentIndex / points.length) * 30;
                drawnWords.push({
                    x: p.x,
                    y: p.y,
                    brightness: brightness
                });
                currentIndex++;
                
                // Запускаем следующее слово через 50мс (очень медленно)
                setTimeout(() => {
                    draw();
                }, 50); // Чем больше число, тем медленнее
            } else {
                // Все слова нарисованы - ждём и перезапускаем
                isAnimating = false;
                setTimeout(() => {
                    // Очищаем и начинаем заново
                    drawnWords = [];
                    currentIndex = 0;
                    draw();
                }, 3000); // Пауза 3 секунды перед повтором
            }
        }
        
        // ===== ЗАПУСК =====
        draw();
        
        // Перезапуск при изменении размера окна
        window.addEventListener('resize', () => {
            resizeCanvas();
            // Пересчитываем координаты
            const newPoints = getHeartPoints();
            points.length = 0;
            points.push(...newPoints);
            drawnWords = [];
            currentIndex = 0;
            if (animationId) {
                clearTimeout(animationId);
            }
            draw();
        });
    </script>
</body>
</html>
